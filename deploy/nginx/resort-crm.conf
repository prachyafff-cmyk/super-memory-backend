# /etc/nginx/sites-available/resort-crm
# หลังรัน `sudo certbot --nginx -d crm.example.com` Certbot จะเพิ่มส่วน HTTPS (443)
# และ redirect HTTP → HTTPS ให้อัตโนมัติ

upstream resort_crm {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;   # ← เปลี่ยนเป็นโดเมนของคุณ

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # gzip สำหรับ HTML/JSON (static ถูกบีบอัดโดย WhiteNoise แล้ว)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://resort_crm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # static files มี hash ในชื่อไฟล์ → cache ยาวได้
    location /static/ {
        proxy_pass http://resort_crm;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
