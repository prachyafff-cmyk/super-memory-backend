{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block auth %}
<div class="flex min-h-full items-center justify-center bg-gradient-to-br from-teal-900 via-teal-800 to-cyan-700 px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center text-white">
      <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-400 text-2xl font-bold text-teal-950">R</span>
      <h1 class="mt-4 text-2xl font-semibold">{{ RESORT_NAME }}</h1>
      <p class="text-sm text-teal-100">ระบบบริหารลูกค้าสัมพันธ์รีสอร์ต</p>
    </div>
    <form method="post" class="card space-y-4 p-6">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-error">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
      {% endif %}
      <div>
        <label class="label" for="id_username">ชื่อผู้ใช้</label>
        <input class="input" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label class="label" for="id_password">รหัสผ่าน</label>
        <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn-primary w-full">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
{% endblock %}
