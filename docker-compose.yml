services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resort_crm}
      POSTGRES_USER: ${POSTGRES_USER:-resort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ในไฟล์ .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: resort-crm:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-resort}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resort_crm}
    depends_on:
      db:
        condition: service_healthy
    # เปิดเฉพาะ localhost — ให้ Nginx บนเครื่อง host เป็นคนรับจากอินเทอร์เน็ต
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
